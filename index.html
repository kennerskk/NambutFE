<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nambut - AI Interactive Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <meta name="description" content="Nambut is an AI Interactive Portfolio designed for the WebMCP Challenge. Build and explore with AI agents." />
  <link rel="canonical" href="https://nambut-fe.vercel.app/" />
  
  <meta property="og:title" content="Nambut - AI Interactive Portfolio" />
  <meta property="og:description" content="Nambut is an AI Interactive Portfolio designed for the WebMCP Challenge. Build and explore with AI agents." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://nambut-fe.vercel.app/" />
  <meta property="og:image" content="https://nambut-fe.vercel.app/favicon.svg" />

  <script type="application/ld+json">
    {
      "@context": "http://schema.org",
      "@type": "WebApplication",
      "name": "Nambut",
      "url": "https://nambut-fe.vercel.app/",
      "description": "AI Interactive Portfolio designed for the WebMCP Challenge",
      "applicationCategory": "DesignApplication"
    }
  </script>
  <script>
    (function () {
      if (typeof document !== 'undefined') {
        if (!document.modelContext) {
          document.modelContext = {};
        }
        var mc = document.modelContext;
        if (!mc._tools) mc._tools = new Map();
        if (!mc.registerTool) {
          mc.registerTool = function (toolDef) {
            if (!toolDef || !toolDef.name) throw new Error('Tool definition must have a name property');
            mc._tools.set(toolDef.name, toolDef);
            return toolDef;
          };
        }
        if (!mc.getTools) {
          mc.getTools = function () { return Array.from(mc._tools.values()); };
        }
        if (!mc.executeTool) {
          mc.executeTool = async function (name, input) {
            var tool = mc._tools.get(name);
            if (!tool) throw new Error('Tool ' + name + ' not found');
            return await tool.execute(input);
          };
        }
        try { window.modelContext = mc; } catch (e) { }
        try { navigator.modelContext = mc; } catch (e) { }
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
